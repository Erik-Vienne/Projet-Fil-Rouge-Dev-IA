name: Tests unitaires

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: agent_ia
      MYSQL_PASSWORD: "AgentIA_2026!"
      MYSQL_DATABASE: catalogue
      RUN_MYSQL_INTEGRATION: "1"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Créer et remplir la base MySQL de test
        run: |
          mysql --host=127.0.0.1 --user=root --password=root < sql/00_mysql_base_et_utilisateur.sql
          mysql --host=127.0.0.1 --user=root --password=root --database=catalogue < sql/01_schema.sql
          mysql --host=127.0.0.1 --user=root --password=root --database=catalogue < sql/02_donnees.sql

      - name: Exécuter les tests et générer le rapport
        run: python -m pytest --junitxml=test-results.xml

      - name: Publier le rapport de tests
        if: always() && hashFiles('test-results.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-unitaires
          path: test-results.xml
          if-no-files-found: error
