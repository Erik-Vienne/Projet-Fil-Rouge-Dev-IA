trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: "3.12"
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: agent_ia
  MYSQL_PASSWORD: "AgentIA_2026!"
  MYSQL_DATABASE: catalogue
  RUN_MYSQL_INTEGRATION: "1"

steps:
  - checkout: self

  - task: UsePythonVersion@0
    displayName: Installer Python $(pythonVersion)
    inputs:
      versionSpec: $(pythonVersion)
      addToPath: true

  - script: python -m pip install -r requirements.txt
    displayName: Installer les dépendances

  - script: |
      set -eu
      docker run --detach --name mysql-ci \
        --env MYSQL_ROOT_PASSWORD=root \
        --publish 3306:3306 \
        mysql:8.0

      ready=0
      for attempt in $(seq 1 60); do
        if docker exec mysql-ci mysqladmin ping --host=127.0.0.1 --password=root --silent; then
          ready=1
          break
        fi
        sleep 2
      done

      if [ "$ready" -ne 1 ]; then
        docker logs mysql-ci
        echo "MySQL n'est pas devenu disponible à temps." >&2
        exit 1
      fi

      docker exec -i mysql-ci mysql --user=root --password=root < sql/00_mysql_base_et_utilisateur.sql
      docker exec -i mysql-ci mysql --user=root --password=root --database=catalogue < sql/01_schema.sql
      docker exec -i mysql-ci mysql --user=root --password=root --database=catalogue < sql/02_donnees.sql
    displayName: Démarrer et initialiser MySQL de test

  - script: python -m pytest --junitxml=test-results.xml
    displayName: Exécuter les tests unitaires et MySQL
    env:
      MYSQL_HOST: $(MYSQL_HOST)
      MYSQL_PORT: $(MYSQL_PORT)
      MYSQL_USER: $(MYSQL_USER)
      MYSQL_PASSWORD: $(MYSQL_PASSWORD)
      MYSQL_DATABASE: $(MYSQL_DATABASE)
      RUN_MYSQL_INTEGRATION: $(RUN_MYSQL_INTEGRATION)

  - task: PublishTestResults@2
    displayName: Publier le rapport de tests
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results.xml
      testRunTitle: Tests unitaires Python
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: false

  - script: docker rm --force mysql-ci
    displayName: Arrêter MySQL de test
    condition: always()
